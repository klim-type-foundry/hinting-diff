[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hinting-diff"
# The version is in the VERSION file (see [tool.setuptools.dynamic]), so uv.lock
# doesn't include it and doesn't need updating when it changes. Pushing a VERSION
# change to `main` publishes the package to PyPI and creates a GitHub release (see
# .github/workflows/release.yml)
dynamic = ["version"]
description = "Compare the TrueType hinting of two versions of a font in a browser"
authors = [{ name = "Klim Type Foundry" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
keywords = ["fonts", "truetype", "hinting", "diff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Fonts",
    "Typing :: Typed",
]
# Projects that use this package pin their own exact versions, so keep these
# ranges wide. Exact versions for development are pinned in uv.lock
dependencies = ["fonttools>=4.40,<5"]

[project.optional-dependencies]
# For --screenshot and the screenshot functions
screenshot = ["playwright>=1.40,<2", "pillow>=10.3,<14"]

[project.urls]
Source = "https://github.com/klim-type-foundry/hinting-diff"
Issues = "https://github.com/klim-type-foundry/hinting-diff/issues"
Changelog = "https://github.com/klim-type-foundry/hinting-diff/releases"

[project.scripts]
hinting-diff = "hinting_diff.cli:main"

# Development tools, not installed by projects that use this package. `uv sync`
# installs the `dev` group by default
[dependency-groups]
dev = [
    "mypy>=2,<3",
    # The screenshot extra's dependencies, for the tests
    "pillow>=10.3,<14",
    "playwright>=1.40,<2",
    "pre-commit>=4,<5",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "twine>=7,<8",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hinting_diff = ["py.typed", "page.html"]

[tool.uv]
required-version = ">=0.13.4"
# Only use Python versions installed by uv, locally and in CI
python-preference = "only-managed"
# Reinstall this project when the VERSION file changes too, so its installed
# version stays up to date
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I", "B"] # Enable isort and flake8-bugbear

[tool.ruff.lint.isort]
known-first-party = ["hinting_diff"]

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report=term-missing"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["hinting_diff"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.mypy]
# No `python_version`, so mypy checks against the running interpreter, which is
# set by `.python-version`
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# fontTools has no type information (no `py.typed`), so it's treated as `Any`
[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true

# Test functions don't need annotations (their bodies are still checked)
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
