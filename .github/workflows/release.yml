name: Ship hinting-diff release
on:
  push:
    branches:
      - main
    paths:
      - VERSION

# Run releases one at a time, in order, without cancelling any (only the latest
# waiting run is kept, if several are queued)
concurrency:
  group: ci-ship-release-${{ github.ref }}
  cancel-in-progress: false

# Each job asks for the permissions it needs
permissions: {}

jobs:
  build:
    name: 'Release: build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Set up Python & run checks
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          cache-dependency-glob: uv.lock
      - name: Install Python dependencies
        run: |
          uv sync --locked --active
      - name: Install Chromium for the screenshot tests
        run: |
          playwright install --with-deps chromium
      - name: Run type checks
        run: |
          mypy
      - name: Run unit tests
        run: |
          pytest

      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION="$(head -1 VERSION | tr -d '[:space:]')"
          echo "Release version number: $RELEASE_VERSION"
          # The latest release that isn't a pre-release, if any
          LATEST_TAG="$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [ -z "$LATEST_TAG" ]; then
            echo "::warning::No previous release found. Skipping version check."
          else
            echo "Latest GitHub release version: $LATEST_TAG"
            # The new version must be higher than that of the latest release
            LATEST_VERSION="${LATEST_TAG#v}"
            HIGHEST_VERSION="$(printf '%s\n%s\n' "$RELEASE_VERSION" "$LATEST_VERSION" | sort -V | tail -1)"
            if [ "$RELEASE_VERSION" = "$LATEST_VERSION" ] || [ "$HIGHEST_VERSION" != "$RELEASE_VERSION" ]; then
              echo "::error::'$RELEASE_VERSION' is not higher than '$LATEST_TAG'"
              exit 1
            fi
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      # Build the sdist and wheel, and check that PyPI will accept and show them
      - name: Build package
        run: |
          uv build --no-sources
          twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Publish to PyPI with trusted publishing, so no PyPI token is stored in GitHub.
  # PyPI only accepts uploads from this workflow, in the `pypi` environment.
  pypi:
    name: 'Release: publish to PyPI'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hinting-diff/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Create the GitHub release after publishing to PyPI, so a failed upload can be
  # re-run without a release already existing for the version
  github-release:
    name: 'Release: create GitHub release'
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Tag the commit that triggered the workflow, rather than the latest
          # commit on `main`, which may already include later, unreleased changes
          gh release create "v$RELEASE_VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$RELEASE_VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
