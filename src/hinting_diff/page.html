<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hinting: {{title}}</title>
<style>
/* The page has to work in old browsers too, as hinting is checked on old versions
   of Windows (e.g. Internet Explorer 11, Chrome 49 and Firefox 52), so newer CSS
   only refines a layout that works without it */
@font-face { font-family: "hinting-old"; src: url("{{before_font}}"); }
@font-face { font-family: "hinting-new"; src: url("{{after_font}}"); }
/* The look of diffenator2's pages, so the page fits in with them in a report.
   These styles are adapted from diffenator2's templates/_base.html
   (https://github.com/googlefonts/diffenator2), Copyright Google LLC, licensed
   under the Apache License 2.0 */
html { font-family: sans-serif; }
body { font-family: Helvetica; }
#nav { position: fixed; right: 20px; z-index: 100; }
.nav-item { display: block; cursor: pointer; -webkit-user-select: none;
  -moz-user-select: none; -ms-user-select: none; user-select: none;
  text-align: center; color: white; background-color: black; font-size: 9pt;
  padding: 5px; margin: 2px; }
/* .nav-item's display would show hidden items */
.nav-item[hidden] { display: none; }
.nav-item select, .nav-item input { background-color: black; color: white;
  font-size: 9pt; }
#filter { width: 7em; border: 1px solid white; }
.box-title { width: 100%; font-size: 8pt; font-weight: 700;
  border-top: 1px solid black; padding-top: 5px; margin-bottom: 10pt;
  display: block; }
.box { margin-bottom: 20pt; }
.warning { font-size: 9pt; }
.sample { font-kerning: none; font-feature-settings: "liga" 0, "clig" 0, "calt" 0;
  font-synthesis: none; line-height: 1.2; white-space: pre; }
.box-text { outline: none; }
/* Every character the font encodes, wrapped anywhere, as it has no spaces.
   Browsers without `overflow-wrap: anywhere` break words anywhere instead */
#text-sample { white-space: pre-wrap; word-break: break-all;
  margin-right: 150px; }
@supports (overflow-wrap: anywhere) {
  #text-sample { word-break: normal; overflow-wrap: anywhere; }
}
/* One line for each size, cut off at the right rather than wrapped */
#text-waterfall { margin-right: 150px; }
.text-line { display: -ms-flexbox; display: flex; -ms-flex-align: baseline;
  align-items: baseline; }
.text-line .size-label { -ms-flex: none; flex: none; width: 3em; }
.text-line .box-text { -ms-flex: 1 1 0%; flex: 1 1 0%; min-width: 0;
  overflow: hidden; }
.font-old { font-family: "hinting-old"; }
.font-new { font-family: "hinting-new"; }
.missing { font-size: 8pt; color: #888; }
.size-label { display: block; font-size: 7pt; color: #888; }
/* Margins rather than `gap`, which old browsers don't support in flex layouts */
#waterfall-samples { display: -ms-flexbox; display: flex; -ms-flex-wrap: wrap;
  flex-wrap: wrap; -ms-flex-align: baseline; align-items: baseline;
  margin-right: 150px; }
#waterfall-samples > span { margin: 0 12px 4px 0; }
/* The glyphs' cells are as wide as the size in ppem needs (see #glyph-size-style).
   In browsers with grid layout, they also stretch to fill each row */
#glyphs { margin-right: 150px; }
.glyph { display: inline-block; vertical-align: top; margin: 2px;
  -webkit-box-sizing: border-box; box-sizing: border-box;
  border: 1px dashed grey; padding: 4px; cursor: pointer; overflow: hidden;
  background: none; color: inherit; font: inherit; text-align: center; }
@supports (display: grid) {
  #glyphs { display: grid; grid-gap: 4px; gap: 4px; }
  .glyph { margin: 0; }
}
.glyph[aria-pressed="true"] { border: 1px solid black; }
.glyph .missing { white-space: nowrap; }
/* Capture mode (see applyUrlSettings()), for screenshots: only the samples, without
   the menus, the heading or the space kept for the menus */
.capture #nav, .capture h2, .capture #platform-warning { display: none; }
.capture #text-sample, .capture #text-waterfall, .capture #waterfall-samples,
.capture #glyphs { margin-right: 0; }
</style>
<!-- The glyphs' cell size, set from the size in ppem -->
<style id="glyph-size-style"></style>
</head>
<body>
<div id="nav">
<div class="nav-item" id="font-toggle">old</div>
<div class="nav-item">
<label for="ppem">Font Size:</label>
<select id="ppem"></select>
</div>
<div class="nav-item">
<label for="text-choice">Text:</label>
<select id="text-choice">
<option value="all">All characters</option>
<option value="basic">Basic Latin</option>
<option value="custom">Custom</option>
</select>
</div>
<div class="nav-item">
<label><input type="checkbox" id="text-waterfall-toggle"> Text waterfall</label>
</div>
<div class="nav-item" id="instance-item" hidden>
<label for="instance">Instance:</label>
<select id="instance"></select>
</div>
<div class="nav-item">
<label for="filter">Glyphs:</label>
<input type="text" id="filter" placeholder="Filter by name">
</div>
</div>
<div id="content">
<h2><b>Hinting</b></h2>
<p class="warning" id="platform-warning" hidden>Browsers only apply TrueType
hinting on Windows, so open this page on Windows to inspect it.</p>
<div class="box" id="text-box">
<div class="box-title" id="text-title"></div>
<div contenteditable="true" spellcheck="false" class="box-text sample"
  id="text-sample"></div>
<div id="text-waterfall" hidden></div>
</div>
<div class="box" id="waterfall" hidden>
<div class="box-title" id="waterfall-title"></div>
<div id="waterfall-samples"></div>
</div>
<div class="box" id="glyphs-box">
<div class="box-title" id="glyphs-title"></div>
<div id="glyphs"></div>
</div>
</div>
<script>
// ES5 only, without newer DOM methods (e.g. `replaceChildren()` or `append()`), as
// the page has to work in old browsers too, e.g. Internet Explorer 11, Chrome 49
// and Firefox 52 on old versions of Windows. tests/test_page.py checks for some of
// the newer syntax and methods.
var DATA = {{hinting_json}};
var TITLE = {{title_json}};
var fontToggle = document.getElementById("font-toggle");
var ppemSelect = document.getElementById("ppem");
var instanceSelect = document.getElementById("instance");
var filterInput = document.getElementById("filter");
var textSample = document.getElementById("text-sample");
var textChoiceSelect = document.getElementById("text-choice");
var textWaterfallToggle = document.getElementById("text-waterfall-toggle");
var textWaterfallDiv = document.getElementById("text-waterfall");
var glyphsDiv = document.getElementById("glyphs");
var glyphSizeStyle = document.getElementById("glyph-size-style");
function sizeRange(min, max) {
  var sizes = [];
  for (var size = min; size <= max; size++) sizes.push(size);
  return sizes;
}
var PPEM_SIZES = sizeRange(8, 64).concat([72, 96]);
// The sizes of the waterfalls, which the URL can change (see applyUrlSettings())
var DEFAULT_WATERFALL_SIZES = sizeRange(8, 64);
var WATERFALL_SIZES = DEFAULT_WATERFALL_SIZES;
var DEFAULT_PPEM = 48;
// The settings are kept for the browser tab's session, so they stay the same when
// another font's page is opened in the same tab (e.g. in a report's frame)
var SETTINGS_KEY = "hinting-diff";
// Like diffenator2's pages, one font is shown at a time, so switching between
// them shows what changed
var font = "old";
var selectedGlyph = null;
// The sample text: every character the font encodes ("all"), Basic Latin
// ("basic"), or the text as it's been edited ("custom")
var TEXT_CHOICES = ["all", "basic", "custom"];
var textChoice = "all";
var editedText = null;
// The sample text at each size, rather than at the font size
var textWaterfall = false;
// Only the samples, for screenshots (see applyUrlSettings())
var capture = false;

function indexWhere(items, test) {
  for (var i = 0; i < items.length; i++) {
    if (test(items[i])) return i;
  }
  return -1;
}

function removeChildren(element) {
  while (element.firstChild) element.removeChild(element.firstChild);
}

// Appended as one fragment, so the page is laid out once
function setChildren(element, children) {
  var fragment = document.createDocumentFragment();
  for (var i = 0; i < children.length; i++) fragment.appendChild(children[i]);
  removeChildren(element);
  element.appendChild(fragment);
}

// Like String.fromCodePoint(), for codepoints above U+FFFF too
function codepointString(codepoint) {
  if (codepoint <= 0xffff) return String.fromCharCode(codepoint);
  var offset = codepoint - 0x10000;
  return String.fromCharCode(0xd800 + (offset >> 10), 0xdc00 + (offset & 0x3ff));
}

// Basic Latin's letters, figures and punctuation, in groups, without the ones the
// font doesn't encode, which would be shown in another font
function basicText() {
  var ranges = [
    [[0x41, 0x5a]],
    [[0x61, 0x7a]],
    [[0x30, 0x39]],
    [[0x21, 0x2f], [0x3a, 0x40], [0x5b, 0x60], [0x7b, 0x7e]]
  ];
  return ranges
    .map(function (group) {
      var chars = "";
      group.forEach(function (range) {
        for (var codepoint = range[0]; codepoint <= range[1]; codepoint++) {
          var char = String.fromCharCode(codepoint);
          if (DATA.sampleText.indexOf(char) >= 0) chars += char;
        }
      });
      return chars;
    })
    .filter(Boolean)
    .join(" ");
}
var BASIC_TEXT = basicText();

function sampleText() {
  if (textChoice === "custom" && editedText !== null) return editedText;
  return textChoice === "basic" ? BASIC_TEXT : DATA.sampleText;
}

function setHidden(element, hidden) {
  element.hidden = hidden;
  // For browsers that don't hide elements with the `hidden` attribute
  element.style.display = hidden ? "none" : "";
}

if (!/Win/.test(navigator.userAgent)) {
  setHidden(document.getElementById("platform-warning"), false);
}

PPEM_SIZES.forEach(function (ppem) {
  var option = document.createElement("option");
  option.value = String(ppem);
  option.textContent = ppem + " ppem";
  ppemSelect.appendChild(option);
});
ppemSelect.value = String(DEFAULT_PPEM);
DATA.instances.forEach(function (instance, index) {
  var option = document.createElement("option");
  option.value = String(index);
  option.textContent = instance.name;
  instanceSelect.appendChild(option);
});
setHidden(document.getElementById("instance-item"), !DATA.instances.length);

// Storage can be unavailable, e.g. for pages opened from files in some browsers
function loadSettings() {
  var settings = null;
  try {
    settings = JSON.parse(sessionStorage.getItem(SETTINGS_KEY));
  } catch (error) {}
  if (!settings) return;
  if (PPEM_SIZES.indexOf(settings.ppem) >= 0) ppemSelect.value = String(settings.ppem);
  if (settings.font === "old" || settings.font === "new") font = settings.font;
  if (typeof settings.filter === "string") filterInput.value = settings.filter;
  if (typeof settings.text === "string") editedText = settings.text;
  if (TEXT_CHOICES.indexOf(settings.textChoice) >= 0) {
    textChoice = settings.textChoice;
  } else if (editedText !== null) {
    // Settings from before the text could be chosen
    textChoice = "custom";
  }
  textWaterfall = settings.textWaterfall === true;
  var index = indexWhere(DATA.glyphs, function (g) {
    return g.name === settings.glyph;
  });
  selectedGlyph = index >= 0 ? DATA.glyphs[index] : null;
}

function saveSettings() {
  var settings = {
    ppem: Number(ppemSelect.value),
    font: font,
    filter: filterInput.value,
    text: editedText,
    textChoice: textChoice,
    textWaterfall: textWaterfall,
    glyph: selectedGlyph ? selectedGlyph.name : null
  };
  try {
    sessionStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch (error) {}
}

loadSettings();

// The value of a parameter in the URL's fragment, e.g. "style" in "#style=Bold"
function hashParam(name) {
  var pairs = location.hash.slice(1).split("&");
  for (var i = 0; i < pairs.length; i++) {
    var pair = pairs[i].split("=");
    if (decodeURIComponent(pair[0]) !== name) continue;
    try {
      return decodeURIComponent((pair[1] || "").replace(/\+/g, " "));
    } catch (error) {
      return null;
    }
  }
  return null;
}

// The settings in the URL's fragment, e.g. "#font=new&ppem=12&glyph=a", which
// win over the ones kept for the session, so a link shows what it describes. Only
// the settings in the URL change, e.g. a report's frame only gives the style.
//
// - style: a variable font's instance, by its name, which hides the Instance menu
// - font: "old" or "new"
// - ppem: the font size, in pixels per em
// - text: the sample text, "all", "basic" or "custom"
// - custom: the custom text, which makes it the sample text
// - waterfall: "1" for the text waterfall, "0" for the text at the font size
// - sizes: the waterfalls' sizes, e.g. "9-24" (8-64 by default)
// - glyph: the glyph shown in a waterfall, by its name (empty for none)
// - filter: the glyphs' filter
// - capture: "1" to show only the samples, for screenshots
function applyUrlSettings() {
  var style = hashParam("style");
  var index = indexWhere(DATA.instances, function (i) {
    return i.name === style;
  });
  if (index >= 0) instanceSelect.value = String(index);
  setHidden(
    document.getElementById("instance-item"),
    !DATA.instances.length || index >= 0
  );

  var fontParam = hashParam("font");
  if (fontParam === "old" || fontParam === "new") font = fontParam;
  var ppem = Number(hashParam("ppem"));
  if (PPEM_SIZES.indexOf(ppem) >= 0) ppemSelect.value = String(ppem);
  var custom = hashParam("custom");
  if (custom !== null) {
    editedText = custom;
    textChoice = "custom";
  }
  var text = hashParam("text");
  if (TEXT_CHOICES.indexOf(text) >= 0) {
    // The custom text starts as the text that's shown, as with the Text menu
    if (text === "custom" && editedText === null) editedText = sampleText();
    textChoice = text;
  }
  var waterfall = hashParam("waterfall");
  if (waterfall === "1" || waterfall === "0") textWaterfall = waterfall === "1";
  // Like capture, the sizes aren't kept for the session
  var sizes = /^(\d+)-(\d+)$/.exec(hashParam("sizes") || "");
  WATERFALL_SIZES =
    sizes && Number(sizes[1]) >= 1 && Number(sizes[1]) <= Number(sizes[2])
      ? sizeRange(Number(sizes[1]), Math.min(Number(sizes[2]), 200))
      : DEFAULT_WATERFALL_SIZES;
  var glyphParam = hashParam("glyph");
  if (glyphParam !== null) {
    var glyphIndex = indexWhere(DATA.glyphs, function (g) {
      return g.name === glyphParam;
    });
    selectedGlyph = glyphIndex >= 0 ? DATA.glyphs[glyphIndex] : null;
  }
  var filter = hashParam("filter");
  if (filter !== null) filterInput.value = filter;

  capture = hashParam("capture") === "1";
  var root = document.documentElement;
  root.className = root.className.replace(/(^| )capture\b/g, "");
  if (capture) root.className += " capture";

  textChoiceSelect.value = textChoice;
  textWaterfallToggle.checked = textWaterfall;
  textSample.textContent = sampleText();
  // Editing isn't needed in screenshots, and would show a caret
  textSample.contentEditable = capture ? "false" : "true";
  saveSettings();
}
applyUrlSettings();
window.addEventListener("hashchange", function () {
  applyUrlSettings();
  lastFilter = filterInput.value;
  render();
});

// CSS pixels are device pixels times the zoom and display scaling, so sizes are
// divided by the ratio to get the size in device pixels per em
function pixelRatio() {
  return window.devicePixelRatio || 1;
}

function cssSize(ppem) {
  return ppem / pixelRatio() + "px";
}

function variationSettings() {
  var instance = DATA.instances[Number(instanceSelect.value)];
  if (!instance) return "normal";
  var settings = [];
  for (var tag in instance.coords) {
    if (Object.prototype.hasOwnProperty.call(instance.coords, tag)) {
      settings.push('"' + tag + '" ' + instance.coords[tag]);
    }
  }
  return settings.join(", ");
}

function styleSample(element, ppem) {
  element.className = element.className.replace(/(^| )font-(old|new)\b/g, "");
  element.className += " font-" + font;
  element.style.fontSize = cssSize(ppem);
  // Browsers without variable fonts ignore it
  element.style.fontVariationSettings = variationSettings();
}

function glyphSample(glyph, ppem) {
  var span = document.createElement("span");
  if (glyph[font] === null) {
    span.className = "missing";
    span.textContent = "not in " + font;
    return span;
  }
  span.className = "sample";
  span.textContent = codepointString(glyph[font]);
  styleSample(span, ppem);
  return span;
}

function title(parts) {
  var instance = DATA.instances[Number(instanceSelect.value)];
  return [font, TITLE, instance ? instance.name : null]
    .concat(parts)
    .filter(Boolean)
    .join(" ");
}

function waterfallRange() {
  return (
    WATERFALL_SIZES[0] + "–" + WATERFALL_SIZES[WATERFALL_SIZES.length - 1] + " ppem"
  );
}

// How to use a part of the page, left out of its title in screenshots
function hint(text) {
  return capture ? "" : " (" + text + ")";
}

function renderWaterfall() {
  setHidden(document.getElementById("waterfall"), !selectedGlyph);
  if (!selectedGlyph) return;
  document.getElementById("waterfall-title").textContent = title([
    selectedGlyph.name,
    waterfallRange()
  ]);
  setChildren(
    document.getElementById("waterfall-samples"),
    WATERFALL_SIZES.map(function (ppem) {
      var cell = document.createElement("span");
      var label = document.createElement("span");
      label.className = "size-label";
      label.textContent = String(ppem);
      cell.appendChild(glyphSample(selectedGlyph, ppem));
      cell.appendChild(label);
      return cell;
    })
  );
}

// The sample text's elements that can be edited, which all show the same text
function textElements() {
  var elements = [textSample];
  var lines = textWaterfallDiv.getElementsByTagName("div");
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].className.indexOf("box-text") >= 0) elements.push(lines[i]);
  }
  return elements;
}

function renderText() {
  var ppem = Number(ppemSelect.value);
  document.getElementById("text-title").textContent =
    title([textWaterfall ? waterfallRange() : ppem + " ppem"]) +
    hint("click the text to edit it");
  setHidden(textSample, textWaterfall);
  setHidden(textWaterfallDiv, !textWaterfall);
  styleSample(textSample, ppem);
  if (!textWaterfall) {
    removeChildren(textWaterfallDiv);
    return;
  }
  var text = sampleText();
  setChildren(
    textWaterfallDiv,
    WATERFALL_SIZES.map(function (size) {
      var line = document.createElement("div");
      line.className = "text-line";
      var label = document.createElement("span");
      label.className = "size-label";
      label.textContent = String(size);
      var sample = document.createElement("div");
      sample.className = "box-text sample";
      sample.contentEditable = capture ? "false" : "true";
      sample.spellcheck = false;
      sample.textContent = text;
      styleSample(sample, size);
      listenForEdits(sample);
      line.appendChild(label);
      line.appendChild(sample);
      return line;
    })
  );
}

// Wide enough for most glyphs, which are cut off rather than overlapping
function setGlyphCellSize(ppem) {
  var width = Math.max(40, Math.ceil((ppem / pixelRatio()) * 1.25)) + "px";
  glyphSizeStyle.textContent =
    ".glyph { width: " + width + "; }\n" +
    "@supports (display: grid) {\n" +
    "  #glyphs { grid-template-columns: repeat(auto-fill, minmax(" + width + ", 1fr)); }\n" +
    "  .glyph { width: auto; }\n" +
    "}";
}

function glyphButton(glyph, ppem) {
  var button = document.createElement("button");
  button.type = "button";
  button.className = "glyph";
  button.title = glyph.name;
  button.setAttribute("aria-label", glyph.name);
  button.setAttribute("aria-pressed", String(glyph === selectedGlyph));
  button.appendChild(glyphSample(glyph, ppem));
  button.addEventListener("click", function () {
    selectedGlyph = glyph === selectedGlyph ? null : glyph;
    saveSettings();
    renderGlyphs();
    renderWaterfall();
  });
  return button;
}

function renderGlyphs() {
  var ppem = Number(ppemSelect.value);
  var filter = filterInput.value.replace(/^\s+|\s+$/g, "").toLowerCase();
  document.getElementById("glyphs-title").textContent =
    title([ppem + " ppem"]) + hint("click a glyph for a waterfall, hover for its name");
  setGlyphCellSize(ppem);
  setChildren(
    glyphsDiv,
    DATA.glyphs
      .filter(function (glyph) {
        return !filter || glyph.name.toLowerCase().indexOf(filter) >= 0;
      })
      .map(function (glyph) {
        return glyphButton(glyph, ppem);
      })
  );
}

function render() {
  var ppem = Number(ppemSelect.value);
  fontToggle.textContent = font;
  renderText();
  renderWaterfall();
  renderGlyphs();
}

function change() {
  saveSettings();
  render();
}

// Editing the text at one size changes it at the others, and makes it the custom
// text
function textChanged(element) {
  var text = element.textContent;
  if (text === sampleText()) return;
  editedText = text;
  textChoice = "custom";
  textChoiceSelect.value = textChoice;
  textElements().forEach(function (other) {
    if (other !== element) other.textContent = text;
  });
  saveSettings();
}

// Internet Explorer doesn't send "input" events for editable elements
function listenForEdits(element) {
  ["input", "keyup", "blur", "paste", "cut"].forEach(function (type) {
    element.addEventListener(type, function () {
      // After a paste or cut has changed the text
      setTimeout(function () {
        textChanged(element);
      }, 0);
    });
  });
}

fontToggle.addEventListener("click", function () {
  font = font === "old" ? "new" : "old";
  change();
});
ppemSelect.addEventListener("change", change);
instanceSelect.addEventListener("change", render);
// Internet Explorer doesn't send "input" events for some changes, so "keyup" and
// "change" are listened to as well
function filterChanged() {
  saveSettings();
  renderGlyphs();
}
var lastFilter = filterInput.value;
["input", "keyup", "change"].forEach(function (type) {
  filterInput.addEventListener(type, function () {
    if (filterInput.value === lastFilter) return;
    lastFilter = filterInput.value;
    filterChanged();
  });
});
listenForEdits(textSample);
textChoiceSelect.addEventListener("change", function () {
  // The custom text starts as the text that's shown
  if (textChoiceSelect.value === "custom" && editedText === null) {
    editedText = sampleText();
  }
  textChoice = textChoiceSelect.value;
  textSample.textContent = sampleText();
  saveSettings();
  renderText();
});
textWaterfallToggle.addEventListener("click", function () {
  textWaterfall = textWaterfallToggle.checked;
  saveSettings();
  renderText();
});
// The pixel ratio changes with the browser's zoom, which resizes the window
window.addEventListener("resize", render);
render();

// For tools that take screenshots of the page: `data-ready` is set on the <html>
// element once both fonts have loaded. Browsers without the CSS Font Loading API
// set it when the page has loaded.
function setReady() {
  document.documentElement.setAttribute("data-ready", "true");
}
if (document.fonts && document.fonts.load) {
  // One after the other, without Promise.all(), which old browsers lack
  document.fonts
    .load('16px "hinting-old"')
    .then(function () {
      return document.fonts.load('16px "hinting-new"');
    })
    .then(setReady, setReady);
} else {
  window.addEventListener("load", setReady);
}
</script>
</body>
</html>
